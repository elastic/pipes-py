---
agents:
  image: "ghcr.io/astral-sh/uv:python3.11-bookworm@sha256:58683a39536f1f4ed2e1dd79cf155edccfb47731aba8964bd0312aac942126cf"

steps:
  - group: "ec.users"
    steps:
      - label: "Create and destroy keys"
        command: |
          echo "~~~ Install dependencies"
          pip install .
          echo "+++ Run tests"
          export EC_API_URL=$(buildkite-agent meta-data get "ec-api-url")
          export EC_API_KEY=$(buildkite-agent meta-data get "ec-api-key")
          KEY_DESCRIPTION="bk-${BUILDKITE_PIPELINE_NAME}-${BUILDKITE_BUILD_NUMBER}"
          ./ec/users/auth/test.yaml --log-level=info -a key-description="$$KEY_DESCRIPTION"

  - group: "ec.deployments"
    steps:
      - label: "Create deployment and test Kibana rules"
        key: create-deployment
        command: |
          echo "~~~ Install dependencies"
          apt-get update -qq && apt-get install -y -qq jq
          pip install . 'uv==0.13.9'
          echo "+++ Create deployment"
          export EC_API_URL=$(buildkite-agent meta-data get "ec-api-url")
          export EC_API_KEY=$(buildkite-agent meta-data get "ec-api-key")
          export EC_DEPLOYMENT_NAME="bk-pipes-${BUILDKITE_BUILD_NUMBER}-$(echo "${BUILDKITE_BRANCH}" | tr -cs '[:alnum:]' '-' | tr '[:upper:]' '[:lower:]')"
          umask 077
          trap 'rm -f deployment.json' EXIT
          exit_code=0
          ./ec/deployments/test-create.yaml --log-level=info || exit_code=$?
          EC_DEPLOYMENT_ID="$(python -c 'import json; print(json.load(open("deployment.json")).get("id") or "")' 2>/dev/null || true)"
          if [ -n "$$EC_DEPLOYMENT_ID" ]; then
            buildkite-agent meta-data set "deployment-id" "$$EC_DEPLOYMENT_ID"
          fi
          if [ "$$exit_code" -ne 0 ]; then
            exit "$$exit_code"
          fi
          if [ -z "$$EC_DEPLOYMENT_ID" ]; then
            echo "Deployment creation did not return an ID" >&2
            exit 1
          fi
          .buildkite/scripts/test-kbn-rules.sh

      - label: "Destroy deployment"
        depends_on:
          - create-deployment
        command: |
          echo "~~~ Install dependencies"
          pip install .
          echo "+++ Destroy deployment"
          export EC_API_URL=$(buildkite-agent meta-data get "ec-api-url")
          export EC_API_KEY=$(buildkite-agent meta-data get "ec-api-key")
          export EC_DEPLOYMENT_ID=$(buildkite-agent meta-data get "deployment-id" --default "")
          if [ -n "$$EC_DEPLOYMENT_ID" ]; then
            ./ec/deployments/test-destroy.yaml --log-level=info
          else
            echo "No deployment ID, skipping destroy"
          fi
        allow_dependency_failure: true
